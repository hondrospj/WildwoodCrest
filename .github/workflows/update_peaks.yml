name: Peaks Cache

on:
  workflow_dispatch:
    inputs:
      backfill:
        description: "Rebuild Lewes history and fill the early USGS record"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - tools/update_history.js
      - tools/history_data.js
      - .github/workflows/update_peaks.yml

  # Run once per day. GitHub schedules are UTC.
  # This runs at 6:17 AM UTC, which is 1:17 AM EST / 2:17 AM EDT.
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: wildwoodcrest-data-update
  cancel-in-progress: false

jobs:
  update:
    name: Update peaks cache
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run updater
        shell: bash
        env:
          BACKFILL: ${{ inputs.backfill || false }}
        run: |
          if [[ "$BACKFILL" == "true" ]]; then
            node tools/update_history.js --backfill
          else
            node tools/update_history.js
          fi

      - name: Validate history and dashboard contracts
        run: node tools/test_dashboard.cjs

      - name: Commit and push if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/peaks_navd88.json data/annual_flood_counts.json

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update peaks cache"
          git pull --rebase
          git push

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
