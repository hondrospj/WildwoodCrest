name: Peaks Cache

on:
  workflow_dispatch:
    inputs:
      backfill:
        description: "Rebuild Lewes history and fill the early USGS record"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - tools/update_history.js
      - tools/history_data.js
      - .github/workflows/update_peaks.yml

  # Run once per day. GitHub schedules are UTC.
  # This runs at 6:17 AM UTC, which is 1:17 AM EST / 2:17 AM EDT.
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: wildwoodcrest-data-update
  cancel-in-progress: false

jobs:
  update:
    name: Update peaks cache
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run universal V2 updater
        run: node tools/update_peaks_navd88.js

      - name: Commit and push if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/peaks_navd88.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Update peaks cache"
          git pull --rebase
          git push
